<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión | Computadores</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #ffffff; color: #000000; margin: 0; padding: 20px;">

    <hr style="border: 0; height: 1px; background-color: #000000; width: 90%;">

    <main>
        <center>
            <br>
            <h2>Iniciar sesión</h2>
            <p>Ingresa tus datos para acceder al sistema </p>

            <form action="#" method="post">
                <table border="1" cellpadding="10" cellspacing="0" width="460" bgcolor="#ffffff">
                    <tr>
                        <th colspan="2" align="center">Formulario de inicio de sesión</th>
                    </tr>

                    <tr>
                        <td align="right" width="45%">
                            <b><label for="usuario">Usuario: </label></b>
                        </td>
                        <td align="left">
                            <input type="text" id="usuario" name="usuario" size="26" placeholder="Ingresa tu usuario" required>
                        </td>
                    </tr>

                    <tr>
                        <td align="right">
                            <b><label for="password">Contraseña: </label></b>
                        </td>
                        <td align="left">
                            <input type="password" id="password" name="password" size="26" placeholder="Ingresa tu contraseña" required>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" align="center">
                            <br>
                            <input type="submit" value="Ingresar" style="background-color: #000000; color: #ffffff; border: 1px solid #000000; padding: 8px 24px; font-size: 15px; font-weight: bold; cursor: pointer;">
                            <br><br>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" align="center">
                            <small>
                                ¿No tienes una cuenta?
                                <a href="registro.html" style="color: #000000;"><b>Crear cuenta nueva</b></a>
                            </small>
                        </td>
                    </tr>
                </table>
            </form>

            
        </center>
    </main>

    <hr style="border: 0; height: 1px; background-color: #000000; width: 90%;">

</body>

</html>
