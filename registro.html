<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cuenta | Computadores</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #ffffff; color: #000000; margin: 0; padding: 20px;">

    <hr style="border: 0; height: 1px; background-color: #000000; width: 90%;">

    <main>
        <center>
            <br>
            <h2>Crear una nueva cuenta</h2>
            <p>Diligencia el formulario para registrarte en el portal de computadores:</p>

            <form action="#" method="post">
                <table border="1" cellpadding="10" cellspacing="0" width="500" bgcolor="#ffffff">
                    <tr>
                        <th colspan="2" align="center">Formulario de registro</th>
                    </tr>

                    <tr>
                        <td align="right" width="45%">
                            <b><label for="nombre">Nombre completo :</label></b>
                        </td>
                        <td align="left">
                            <input type="text" id="nombre" name="nombre" size="28" placeholder="Ej: Carlos Gómez" required>
                        </td>
                    </tr>

                    <tr>
                        <td align="right">
                            <b><label for="correo">Correo electrónico :</label></b>
                        </td>
                        <td align="left">
                            <input type="email" id="correo" name="correo" size="28" placeholder="correo@ejemplo.com" required>
                        </td>
                    </tr>

                    <tr>
                        <td align="right">
                            <b><label for="telefono">Teléfono :</label></b>
                        </td>
                        <td align="left">
                            <input type="tel" id="telefono" name="telefono" size="28" placeholder="300 123 4567" required>
                        </td>
                    </tr>

                    <tr>
                        <td align="right">
                            <b><label for="usuario_reg">Nombre de usuario :</label></b>
                        </td>
                        <td align="left">
                            <input type="text" id="usuario_reg" name="usuario" size="28" placeholder="Elige un usuario" required>
                        </td>
                    </tr>

                    <tr>
                        <td align="right">
                            <b><label for="password_reg">Contraseña :</label></b>
                        </td>
                        <td align="left">
                            <input type="password" id="password_reg" name="password" size="28" placeholder="Mínimo 6 caracteres" minlength="6" required>
                        </td>
                    </tr>

                    <tr>
                        <td align="right">
                            <b><label for="confirmar_password">Confirmar contraseña :</label></b>
                        </td>
                        <td align="left">
                            <input type="password" id="confirmar_password" name="confirmar_password" size="28" placeholder="Repite tu contraseña" minlength="6" required>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" align="center">
                            <br>
                            <input type="submit" value="Registrarme" style="background-color: #000000; color: #ffffff; border: 1px solid #000000; padding: 8px 24px; font-size: 15px; font-weight: bold; cursor: pointer;">
                            <br><br>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" align="center">
                            <small>
                                ¿Ya tienes una cuenta registrada?
                                <a href="iniciosesion.html" style="color: #000000;"><b>Inicia sesión aquí</b></a>
                            </small>
                        </td>
                    </tr>
                </table>
            </form>

            
        </center>
    </main>

    <hr style="border: 0; height: 1px; background-color: #000000; width: 90%;">

</body>

</html>
